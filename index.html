<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손톱건선 치료 가이드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 어두운 전면 표지 → 목차 → 좌측 고정 네비게이션 + 본문 6개 장. 표지·목차·네비게이션·장 제목은 지정 서체(블랙한산스), 본문은 노토 산스 */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#0A141B; --muted:#3A4D5C; --line:#D3DDE4;
  --accent:#0B6B83; --accent-ink:#FFFFFF; --salmon:#E2674B; --salmon-soft:#F9E0D8; --bar:#B9C8D2; --nail:#F1E3DA;
  --k-all:#33475A; --k-top:#1F7A5C; --k-inj:#B4531E; --k-proc:#6A4BB0; --k-oral:#0E6AA8; --k-bio:#B03A6A;
  --cv-bg:#0A131A; --cv-ink:#F3F7F9; --cv-mute:#9FB3C0; --cv-line:#26414F;
  --f-brand:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C171E; --surface:#14232C; --ink:#F4F9FB; --muted:#B8C9D3; --line:#27404D;
    --accent:#5CC0D6; --accent-ink:#0C171E; --salmon:#F08A6E; --salmon-soft:#4A2A22; --bar:#3B5565; --nail:#3A3330;
    --k-all:#A9BDC9; --k-top:#4FD0A0; --k-inj:#F29A5E; --k-proc:#B79CFF; --k-oral:#5CB8F5; --k-bio:#F27BA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C171E; --surface:#14232C; --ink:#F4F9FB; --muted:#B8C9D3; --line:#27404D;
  --accent:#5CC0D6; --accent-ink:#0C171E; --salmon:#F08A6E; --salmon-soft:#4A2A22; --bar:#3B5565; --nail:#3A3330;
  --k-all:#A9BDC9; --k-top:#4FD0A0; --k-inj:#F29A5E; --k-proc:#B79CFF; --k-oral:#5CB8F5; --k-bio:#F27BA6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cv-bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--salmon);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}

/* ===== 표지 ===== */
.cover{background:var(--cv-bg);color:var(--cv-ink);position:relative;overflow:hidden}
.cover-in{max-width:1240px;margin-inline:auto;min-height:min(100vh,760px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;padding-block:clamp(40px,8vw,88px)}
.eyebrow{font-family:var(--f-brand);letter-spacing:.18em;font-size:.8125rem;color:var(--salmon);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";height:2px;width:56px;background:var(--salmon)}
.cover h1{font-family:var(--f-brand);font-weight:400;font-size:clamp(3.4rem,11vw,7.4rem);line-height:1.02;letter-spacing:-.02em;margin:18px 0 8px}
.cover h1 em{font-style:normal;color:var(--salmon)}
.cover .ko2{font-family:var(--f-brand);font-size:clamp(1.4rem,3.4vw,2.1rem);letter-spacing:.02em}
.cover .lead{max-width:44ch;color:var(--cv-mute);font-size:1.0625rem;font-weight:500;margin-top:22px}
.cover-meta{display:flex;flex-wrap:wrap;gap:0;margin-top:34px;border-top:1px solid var(--cv-line)}
.cover-meta div{padding:14px 28px 0 0;margin-right:28px;min-width:0}
.cover-meta b{display:block;font-family:var(--f-brand);font-weight:400;font-size:1.25rem;letter-spacing:.02em}
.cover-meta span{color:var(--cv-mute);font-size:.8125rem}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:14px 26px;border-radius:999px;background:var(--salmon);color:#1A0E0A;font-family:var(--f-brand);font-size:1.0625rem;text-decoration:none;letter-spacing:.03em}
.cta:hover{filter:brightness(1.08)}
.art{width:100%;max-width:440px;justify-self:end;min-width:0}
.art svg{display:block;width:100%;height:auto}

/* ===== 모바일 상단 바 ===== */
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--ink)}
.topbar-in{display:flex;align-items:center;gap:8px;min-height:52px}
.topbar .brand{font-family:var(--f-brand);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs a{font-family:var(--f-brand);font-size:.9375rem;padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap}
.tabs a[aria-current=true]{background:var(--ink);color:var(--bg)}

/* ===== 레이아웃 ===== */
.shell{max-width:1240px;margin-inline:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;padding-bottom:72px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;padding-top:72px;height:fit-content}
.rail h2{font-family:var(--f-brand);font-weight:400;font-size:.875rem;letter-spacing:.2em;color:var(--muted);margin-bottom:14px}
.rail ol{border-left:2px solid var(--line)}
.rail a{display:grid;grid-template-columns:2.2rem 1fr;align-items:baseline;padding:9px 0 9px 14px;margin-left:-2px;border-left:4px solid transparent;text-decoration:none;color:var(--muted);font-family:var(--f-brand);font-size:1.0625rem;line-height:1.35}
.rail a small{font-size:.8125rem;color:var(--muted)}
.rail a:hover{color:var(--ink)}
.rail a[aria-current=true]{color:var(--ink);border-left-color:var(--salmon)}
.rail a[aria-current=true] small{color:var(--salmon)}
.themebtn{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:transparent;cursor:pointer;font-family:var(--f-brand);font-size:.875rem;letter-spacing:.04em}
.themebtn:hover{background:var(--ink);color:var(--bg)}
.topbar .themebtn{margin:0;padding:6px 12px}

/* ===== 목차 ===== */
.toc{padding-top:72px}
.toc ol{border-top:2px solid var(--ink)}
.toc a{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--surface)}
.toc .n{font-family:var(--f-brand);font-size:1.9rem;color:var(--salmon);line-height:1}
.toc .t{font-family:var(--f-brand);font-size:1.375rem;line-height:1.3}
.toc .d{color:var(--muted);font-size:.9375rem;font-weight:500;margin-top:2px}
.toc .go{font-family:var(--f-brand);color:var(--muted)}

/* ===== 장 ===== */
.chap{padding-top:88px;scroll-margin-top:72px}
.chap-h{display:flex;align-items:baseline;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:12px;flex-wrap:wrap}
.chap-h .no{font-family:var(--f-brand);font-size:1.125rem;color:var(--salmon);letter-spacing:.06em}
.chap-h h2{font-family:var(--f-brand);font-weight:400;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);max-width:64ch;margin:10px 0 24px;font-weight:500}

/* 손톱 탐색기 */
.explorer{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:28px;align-items:start}
.nailbox{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:16px}
.nailsvg{display:block;width:100%;height:auto;max-height:430px}
.nailsvg .reg{opacity:0;transition:opacity .3s ease}
.explorer[data-zone=mat] #r-mat{opacity:.4}
.explorer[data-zone=mat] #g-mat{opacity:.8}
.explorer[data-zone=bed] #r-bed{opacity:.4}
.explorer[data-zone=bed] #g-bed{opacity:1}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);cursor:pointer;font-weight:700;font-size:.9375rem}
.seg button[aria-pressed=true]{background:var(--salmon);border-color:var(--salmon);color:#1A0E0A}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:24px;min-width:0}
.panel h3{font-family:var(--f-brand);font-weight:400;font-size:1.6rem}
.panel .where{color:var(--muted);margin:4px 0 4px}
.panel h4{margin:20px 0 8px;font-family:var(--f-brand);font-weight:400;font-size:.875rem;letter-spacing:.14em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--salmon-soft);padding:4px 12px;border-radius:999px;font-size:.9375rem;font-weight:700}
.first{border-left:5px solid var(--accent);padding:6px 0 6px 16px}
.first strong{display:block;font-weight:900;font-size:1.0625rem}
.first span{color:var(--muted)}

/* 수치 띠 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);overflow:hidden;margin-top:32px}
.fact{background:var(--surface);padding:18px 20px;min-width:0}
.fact .v{font-family:var(--f-brand);font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.fact .l{color:var(--muted);font-size:.875rem;margin-top:6px;line-height:1.5}

/* 상황별 */
.guide{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 28px;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.grow .s{color:var(--muted);font-weight:700}
.grow .f{font-weight:900}
.grow .n{grid-column:1/-1;color:var(--muted);font-size:.9rem}

/* 치료 */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{--k:var(--k-all);font-weight:700;font-size:.9375rem;padding:7px 16px;border-radius:999px;border:2px solid var(--k);background:color-mix(in srgb,var(--k) 14%,var(--surface));cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--k);color:var(--accent-ink)}
.chipbtn[data-c="바르는 약"],.card[data-c="바르는 약"]{--k:var(--k-top)}
.chipbtn[data-c="주사"],.card[data-c="주사"]{--k:var(--k-inj)}
.chipbtn[data-c="시술"],.card[data-c="시술"]{--k:var(--k-proc)}
.chipbtn[data-c="먹는 약"],.card[data-c="먹는 약"]{--k:var(--k-oral)}
.chipbtn[data-c="생물학적제제"],.card[data-c="생물학적제제"]{--k:var(--k-bio)}
.search{flex:1;min-width:190px;font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.count{color:var(--muted);font-size:.875rem;font-weight:700;width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.card{--k:var(--k-all);background:color-mix(in srgb,var(--k) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 45%,var(--line));border-top:6px solid var(--k);border-radius:var(--radius);padding:16px 18px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-weight:900;font-size:1.0625rem;line-height:1.4}
.tag{align-self:flex-start;font-weight:700;font-size:.75rem;letter-spacing:.05em;padding:2px 11px;border-radius:999px;background:var(--k);color:var(--accent-ink)}
.card dl{display:grid;gap:10px}
.card dt{font-family:var(--f-brand);font-size:.75rem;letter-spacing:.12em;color:var(--muted)}
.card dd{font-size:.9375rem}
.empty{color:var(--muted);padding:28px 0;font-weight:700}

/* 차트 */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}
.chart{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.chart h3{font-weight:900;font-size:1.0625rem}
.chart p{margin:2px 0 14px;color:var(--muted);font-size:.875rem;line-height:1.55}
.brow{display:grid;grid-template-columns:6.6rem minmax(0,1fr) 3.5rem;gap:10px;align-items:center;margin:10px 0;font-size:.9375rem;font-weight:700}
.track{height:16px;background:var(--bg);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:5px}
.fill.top{background:var(--salmon)}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.fill{animation:grow .8s cubic-bezier(.2,.7,.2,1) both}}
@keyframes grow{from{width:0}}
.callout{margin-top:16px;padding:14px 18px;border-radius:var(--radius);background:var(--salmon-soft);font-weight:700;font-size:.9375rem}

/* 표·용어 */
.tbl{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:540px}
th{text-align:left;font-family:var(--f-brand);font-weight:400;font-size:.9375rem;letter-spacing:.06em;padding:12px 18px;background:var(--ink);color:var(--bg)}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:900}
details.g{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:0 20px;margin-bottom:8px}
details.g[open]{border-color:var(--ink)}
details.g summary{cursor:pointer;padding:14px 0;font-weight:900}
details.g p{padding-bottom:16px;color:var(--muted)}
.note{margin-top:72px;padding:18px 22px;border:2px solid var(--ink);border-left:8px solid var(--salmon);border-radius:var(--radius);background:var(--surface);font-weight:700;font-size:.9375rem}

/* ===== 반응형 ===== */
@media (max-width:1000px){
  .shell{display:block;padding-bottom:56px}
  .rail{display:none}
  .topbar{display:block}
  .cover-in{grid-template-columns:minmax(0,1fr);min-height:0}
  .art{justify-self:center;max-width:300px;order:-1}
  .toc{padding-top:56px}
  .chap{padding-top:64px;scroll-margin-top:64px}
}
@media (max-width:760px){
  .explorer{grid-template-columns:minmax(0,1fr)}
  .nailbox{max-width:330px}
  .grow{grid-template-columns:minmax(0,1fr)}
  .toc a{grid-template-columns:2.6rem minmax(0,1fr)}
  .toc .go{display:none}
  .cover-meta div{margin-right:18px;padding-right:12px}
}
html{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0}
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>

  var ZONES={
    mat:{title:'조갑기질 침범',where:'손톱을 만드는 뿌리 부분',
      signs:['점상 함몰 (표면의 작은 홈)','흰 반점','손톱 부스러짐','반달(루눌라)의 붉은 점','가로 줄(보 선)'],
      first:'병변 내 스테로이드 주사 (트리암시놀론) 또는 메토트렉세이트 주사',
      note:'손톱 3개 이하, NAPSI 20 이하일 때 1차로 제시됩니다. 바르는 약을 쓸 때는 손톱 뿌리 위 피부 접힘에 막지 않고 바릅니다.'},
    bed:{title:'조갑바닥 침범',where:'손톱 밑의 살',
      signs:['손톱 들뜸 (조갑박리)','기름방울 반점 (주황빛 얼룩)','손톱 밑 각질','선상 출혈','연어색 반점'],
      first:'스테로이드 연고 (클로베타솔 등) ± 비타민D 유도체',
      note:'들뜬 손톱 조각은 잘라내고 바릅니다. 바르는 치료의 효과는 한계가 있다는 평가가 있어 주사나 전신치료로 넘어가기도 합니다.'}
  };

  var GROUPS=[
    ['ixora','IXORA-S 직접비교','52주 손톱 완전 소실(NAPSI 0) 비율'],
    ['radiant','BE RADIANT 직접비교','48주 손톱 완전 소실(mNAPSI 0) 비율'],
    ['dual','피부와 손톱 동시 소실','48주 피부 PASI 100과 손톱 mNAPSI 0을 함께 달성한 비율'],
    ['nma2023','메타분석 추정 (2023)','24–28주 손톱 완전 소실 확률'],
    ['nma2022','메타분석 추정 (2022)','24–26주 손톱 완전 소실 확률'],
    ['nma52','메타분석 추정 (장기)','48–52주 손톱 완전 소실 확률'],
    ['improve24','체계적 고찰','24주 NAPSI 평균 개선률']
  ];
  var CATS=['전체','바르는 약','주사','시술','먹는 약','생물학적제제'];
  var f1=function(v){return (Math.round(v*10)/10).toFixed(1)+'%';};

  function Chap(p){
    return h('section',{className:'chap',id:p.c.id},
      h('div',{className:'chap-h'},h('span',{className:'no'},'CHAPTER '+p.c.no),h('h2',null,p.c.t)),
      p.sub?h('p',{className:'sub'},p.sub):null,
      p.children);
  }

  function Cover(){
    return h('header',{className:'cover',id:'cover'},
      h('div',{className:'cover-in pad'},
        h('div',null,
          h('div',{className:'eyebrow'},'NAIL PSORIASIS GUIDE'),
          h('h1',null,'손톱',h('em',null,'건선')),
          h('div',{className:'ko2'},'치료 가이드'),
          h('p',{className:'lead'},'침범 부위, 손톱 개수, 피부·관절 증상에 따라 치료가 달라집니다. 논문과 리뷰로 정리한 상황별 선택과 치료 비교입니다.'),
          h('div',{className:'cover-meta'},
            h('div',null,h('b',null,'17가지'),h('span',null,'치료 옵션')),
            h('div',null,h('b',null,'6개 장'),h('span',null,'부위부터 용어까지')),
            h('div',null,h('b',null,'2026.11'),h('span',null,'조사 기준'))),
          h('a',{className:'cta',href:'#toc'},'목차 보기 ↓')),
        h('div',{className:'art',dangerouslySetInnerHTML:{__html:COVER_SVG}})));
  }

  function Toc(){
    return h('section',{className:'toc',id:'toc'},
      h('div',{className:'chap-h'},h('span',{className:'no'},'CONTENTS'),h('h2',null,'목차')),
      h('ol',null,CHAPTERS.map(function(c){
        return h('li',{key:c.id},h('a',{href:'#'+c.id},
          h('span',{className:'n'},c.no),
          h('span',null,h('div',{className:'t'},c.t),h('div',{className:'d'},c.d)),
          h('span',{className:'go'},'→')));
      })));
  }

  function Explorer(){
    var s=useState('mat'),zone=s[0],setZone=s[1],z=ZONES[zone];
    return h('div',null,
      h('div',{className:'explorer','data-zone':zone},
        h('div',{className:'nailbox'},
          h('div',{dangerouslySetInnerHTML:{__html:NAIL_SVG}}),
          h('div',{className:'seg',role:'group','aria-label':'침범 부위'},
            ['mat','bed'].map(function(k){return h('button',{key:k,type:'button','aria-pressed':zone===k,onClick:function(){setZone(k);}},k==='mat'?'조갑기질 (뿌리)':'조갑바닥 (밑 살)');}))),
        h('div',{className:'panel','aria-live':'polite'},
          h('h3',null,z.title),h('div',{className:'where'},z.where),
          h('h4',null,'이럴 때 보이는 모양'),
          h('ul',{className:'chips'},z.signs.map(function(x){return h('li',{key:x},x);})),
          h('h4',null,'첫 선택으로 제시되는 치료'),
          h('div',{className:'first'},h('strong',null,z.first),h('span',null,z.note)))),
      h('div',{className:'facts'},DATA.facts.map(function(f){return h('div',{className:'fact',key:f.id},h('div',{className:'v'},f.value),h('div',{className:'l'},f.label));})));
  }

  function Guide(){
    return h('div',{className:'guide'},DATA.guide.map(function(g){
      return h('div',{className:'grow',key:g.id},h('div',{className:'s'},g.situation),h('div',{className:'f'},g.first),h('div',{className:'n'},g.note));}));
  }

  function Options(){
    var a=useState('전체'),cat=a[0],setCat=a[1],b=useState(''),q=b[0],setQ=b[1];
    var rows=useMemo(function(){
      var t=q.trim().toLowerCase();
      return DATA.treatments.filter(function(r){
        if(cat!=='전체'&&r.category!==cat)return false;
        return !t||(r.option+' '+r.when+' '+r.evidence+' '+r.caution).toLowerCase().indexOf(t)>=0;
      });
    },[cat,q]);
    return h('div',null,
      h('div',{className:'tools'},
        h('div',{className:'cats',role:'group','aria-label':'치료 종류'},CATS.map(function(c){
          return h('button',{key:c,type:'button',className:'chipbtn','data-c':c,'aria-pressed':cat===c,onClick:function(){setCat(c);}},c);})),
        h('input',{id:'q',className:'search',type:'search',placeholder:'치료 이름·증상 검색','aria-label':'치료 검색',value:q,onChange:function(e){setQ(e.target.value);}}),
        h('div',{className:'count'},rows.length+'개 표시')),
      rows.length?h('div',{className:'cards'},rows.map(function(r){
        return h('article',{className:'card',key:r.option,'data-c':r.category},
          h('span',{className:'tag'},r.category),h('h3',null,r.option),
          h('dl',null,[['쓰는 상황',r.when],['근거 요약',r.evidence],['주의',r.caution]].map(function(p){
            return h(React.Fragment,{key:p[0]},h('dt',null,p[0]),h('dd',null,p[1]));})));
      })):h('div',{className:'empty'},'조건에 맞는 치료가 없습니다. 검색어를 바꿔 보세요.'));
  }

  function Biologics(){
    return h('div',null,
      h('div',{className:'charts'},GROUPS.map(function(G){
        var rows=DATA.outcomes.filter(function(r){return r.group===G[0];}).sort(function(a,b){return b.value-a.value;});
        if(!rows.length)return null;
        return h('div',{className:'chart',key:G[0]},h('h3',null,G[1]),h('p',null,G[2]),
          rows.map(function(r,i){
            return h('div',{className:'brow',key:r.id},h('span',null,r.drug),
              h('div',{className:'track'},h('div',{className:'fill'+(i===0?' top':''),style:{width:Math.max(0,Math.min(100,r.value))+'%'}})),
              h('span',{className:'v'},f1(r.value)));}));
      })),
      h('div',{className:'callout'},'시험과 분석이 서로 달라 다른 칸의 숫자를 곧바로 비교할 수 없습니다. 같은 칸 안에서만 비교하세요. 직접 맞붙은 시험은 익세키주맙 대 우스테키누맙, 비메키주맙 대 세쿠키누맙 두 건입니다.'));
  }

  function Fungus(){
    return h('div',{className:'tbl'},h('table',null,
      h('thead',null,h('tr',null,h('th',null,'특징'),h('th',null,'손톱건선'),h('th',null,'곰팡이'))),
      h('tbody',null,DATA.ddx.map(function(r){return h('tr',{key:r.feature},h('td',null,r.feature),h('td',null,r.psoriasis),h('td',null,r.fungus));}))));
  }

  function Terms(){
    return h('div',null,DATA.glossary.map(function(g){return h('details',{className:'g',key:g.term},h('summary',null,g.term),h('p',null,g.plain));}));
  }

  function ThemeBtn(p){
    var labels={system:'◐ 시스템',light:'☀ 밝게',dark:'☾ 어둡게'};
    return h('button',{type:'button',className:'themebtn',onClick:p.onClick,'aria-label':'화면 모드 바꾸기'},labels[p.theme]);
  }

  function App(){
    var a=useState('cover'),active=a[0],setActive=a[1];
    var t=useState(function(){try{return localStorage.getItem('nx-theme')||'system';}catch(e){return 'system';}}),theme=t[0],setTheme=t[1];
    useEffect(function(){
      var r=document.documentElement;
      if(theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);
      try{localStorage.setItem('nx-theme',theme);}catch(e){}
    },[theme]);
    useEffect(function(){
      if(!('IntersectionObserver' in window))return;
      var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setActive(e.target.id);});},{rootMargin:'-30% 0px -60% 0px'});
      ['cover','toc'].concat(CHAPTERS.map(function(c){return c.id;})).forEach(function(id){var el=document.getElementById(id);if(el)io.observe(el);});
      return function(){io.disconnect();};
    },[]);
    var cycle=function(){setTheme(theme==='system'?'light':theme==='light'?'dark':'system');};
    var cur=function(id){return active===id;};
    var chapContent={explore:h(Explorer),guide:h(Guide),options:h(Options),biologics:h(Biologics),fungus:h(Fungus),terms:h(Terms)};
    var subs={
      explore:'손톱은 뿌리(조갑기질)와 밑 살(조갑바닥)로 나뉩니다. 부위를 눌러 모양과 첫 선택 치료를 확인하세요.',
      guide:'전문가 리뷰와 가이드라인에서 정리한 기준입니다. 실제 선택은 진료에서 정합니다.',
      options:'종류를 고르거나 약 이름으로 찾아보세요.',
      biologics:'막대가 길수록 손톱 병변이 더 많이 좋아진 비율입니다. 가장 높은 약은 주황색으로 표시했습니다.',
      fungus:'두 병이 함께 있는 경우도 흔합니다. 모양만으로 구분이 어려우면 검사가 필요합니다.',
      terms:'눌러서 쉬운 설명을 펼쳐 보세요.'
    };
    return h(React.Fragment,null,
      h(Cover),
      h('nav',{className:'topbar pad','aria-label':'장 이동'},
        h('div',{className:'topbar-in'},
          h('span',{className:'brand'},'손톱건선'),
          h('div',{className:'tabs'},[{id:'toc',no:'',t:'목차'}].concat(CHAPTERS).map(function(c){
            return h('a',{key:c.id,href:'#'+c.id,'aria-current':cur(c.id)},(c.no?c.no+' ':'')+c.t);})),
          h(ThemeBtn,{theme:theme,onClick:cycle}))),
      h('div',{className:'shell pad'},
        h('aside',{className:'rail'},
          h('h2',null,'CONTENTS'),
          h('ol',null,[{id:'toc',no:'',t:'목차'}].concat(CHAPTERS).map(function(c){
            return h('li',{key:c.id},h('a',{href:'#'+c.id,'aria-current':cur(c.id)},h('small',null,c.no||'—'),h('span',null,c.t)));})),
          h(ThemeBtn,{theme:theme,onClick:cycle})),
        h('main',null,
          h(Toc),
          CHAPTERS.map(function(c){return h(Chap,{key:c.id,c:c,sub:subs[c.id]},chapContent[c.id]);}),
          h('div',{className:'note'},'공개 논문과 리뷰를 정리한 참고용 자료입니다. 약 선택, 용량, 시술 여부는 피부과 전문의 진료로 정하세요. 국내 보험 적용·허가 범위는 이번 조사에 포함하지 않았습니다.'))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
